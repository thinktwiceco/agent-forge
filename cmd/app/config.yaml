agent:
  name: "HelpCrunch Agent"
  system_prompt: |
    You are an agent that should help debugging issues and answer customers on HelpCrunch.
  model: "deepseek::deepseek-chat"
  working_dir: "/home/verte/Desktop/sandbox"
  persistence: "json"
  tools:
    - name: fs
      root: "/home/verte/Desktop/sandbox"
    - name: git
      root: "/home/verte/Desktop/sandbox"
    - name: web
      root: "/home/verte/Desktop/sandbox"
    - name: api
      onApiCallHook: "helpcrunch_auth"
      endpoints:
        - name: get_all_chats
          url: "https://api.helpcrunch.com/v1/chats"
          method: "GET"
          description: "Fetch all chats or a paginated list of chats from HelpCrunch. Returns up to 100 chats per request."
          queryParams: |
            - sort: string - Field to sort by (e.g., 'chats.createdAt', 'chats.lastCustomerMessageAt', 'chats.lastMessageAt', 'chats.closedAt')
            - order: string - Sort order: 'asc' for ascending or 'desc' for descending
            - offset: int - Number of results to skip for pagination (default: 0)
            - limit: int - Number of results to return (default: 100, max: 100)
        - name: get_chat
          url: "https://api.helpcrunch.com/v1/chats/{chat_id}"
          method: "GET"
          description: "Get details of a single chat by its ID"
          urlParameters: |
            - chat_id: int - The unique identifier of the chat to retrieve
        - name: create_chat
          url: "https://api.helpcrunch.com/v1/chats"
          method: "POST"
          description: "Create a new chat on behalf of a specific customer. Note: It is not recommended to create empty chats without messages."
          payload: |
            JSON body with the following fields:
            - customer: int (REQUIRED) - The customer ID for whom to create the chat
            - application: int (REQUIRED) - The application ID
            - assignee: int (optional) - The agent/assignee ID to assign the chat to
            - department: int (optional) - The department ID to assign the chat to
            Example: {"customer": 8738438, "assignee": 4188, "department": 233048, "application": 3838}
        - name: get_chat_messages
          url: "https://api.helpcrunch.com/v1/chats/{chat_id}/messages"
          method: "GET"
          description: "Fetch all messages from a specific chat by chat ID. Messages are sorted by createdAt date in descending order (last message first)."
          urlParameters: |
            - chat_id: int - The unique identifier of the chat (e.g., 1568834)
          queryParams: |
            - offset: int - Number of results to skip for pagination (default: 0)
            - limit: int - Number of results to return (default: 100, max: 100) 
  subagents:
    reasoning: "deepseek::deepseek-chat"
  plugins:
    - "todo"
