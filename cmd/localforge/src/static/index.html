<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThinkTwice Agent</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">✦</span>
          <span class="brand-name" id="agent-name-label">ThinkTwice</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="new-chat" class="btn">New</button>
          <button class="btn" data-auth-logout hidden>Logout</button>
        </div>
      </div>
      <div class="sidebar-nav"
        style="display: flex; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px;">
        <a href="/knowledge" class="btn" style="flex: 1; text-align: center; text-decoration: none;">Knowledge</a>
        <button id="workspace-toggle" class="btn" style="flex: 1; text-align: center; text-decoration: none;">Workspace</button>
        <a href="/settings" class="btn" style="flex: 1; text-align: center; text-decoration: none;">Settings</a>
      </div>
      <div id="conversation-list" class="conversation-list"></div>
    </aside>

    <main class="chat">
      <div id="chat-header" class="chat-header">
        <div class="chat-title" id="chat-title">Chat</div>
        <div class="chat-header-actions">
          <button id="new-chat-header" class="btn" title="New conversation">New chat</button>
          <button id="stop-btn" class="btn stop-btn" style="display:none">&#9646; Stop</button>
          <div id="chat-status" class="chat-status status--idle">
            <span class="status-dot"></span>
            <span class="status-text">Idle</span>
          </div>
        </div>
      </div>
      <div class="chat-messages-wrapper">
        <div id="chat-messages" class="chat-messages"></div>
        <button id="scroll-to-bottom" class="scroll-to-bottom" style="display:none">&#8595; Jump to bottom</button>
      </div>
      <form id="chat-form" class="chat-input">
        <div class="chat-input-row">
          <input type="file" id="image-input" accept="image/*" multiple style="display:none">
          <div class="attach-btn-wrapper">
            <button type="button" id="attach-btn" class="btn-icon attach-btn" title="Attach image">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
              </svg>
            </button>
            <span id="attach-badge" class="attach-badge" style="display:none"></span>
          </div>
          <div class="chat-input-center">
            <div id="image-preview" class="image-preview"></div>
            <textarea id="chat-input"
              placeholder="Send a message… (Enter to send, Shift+Enter for new line)"></textarea>
          </div>
          <button type="submit" class="btn primary">Send</button>
        </div>
      </form>
    </main>

    <aside class="config">
      <div id="todos-panel" class="todos-panel"></div>
    </aside>
  </div>

  <div id="fs-modal" class="fs-modal hidden">
    <div class="fs-modal-content">
      <div class="fs-modal-header">
        <h2>Workspace Files</h2>
        <button id="fs-close" class="btn-icon" style="font-size: 20px;">×</button>
      </div>
      <div class="fs-modal-body">
        <div class="fs-sidebar" id="fs-tree"></div>
        <div class="fs-viewer" id="fs-viewer">
          <div id="fs-viewer-placeholder" class="fs-viewer-placeholder">Select a file to view</div>
          <pre id="fs-file-pre" class="hidden"><code id="fs-file-content"></code></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>

</html>
