name: Release

on:
  push:
    tags:
      - 'python-sdk-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., python-sdk-v0.1.0)'
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # For PyPI publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: version
        working-directory: python-sdk
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION_TAG="${{ inputs.version }}"
          else
            VERSION_TAG="${{ github.ref_name }}"
          fi
          
          # Remove 'python-sdk-v' prefix if present
          VERSION=${VERSION_TAG#python-sdk-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Validate VERSION file exists
        working-directory: python-sdk
        run: |
          if [ ! -f "VERSION" ]; then
            echo "❌ VERSION file not found"
            exit 1
          fi
          echo "✅ VERSION file exists"

      - name: Verify VERSION file matches tag
        id: verify_version
        working-directory: python-sdk
        run: |
          VERSION_FILE=$(cat VERSION)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          
          if [ "$VERSION_FILE" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "VERSION file: $VERSION_FILE"
            echo "Tag version: $TAG_VERSION"
            exit 1
          fi
          echo "✅ Version matches: $VERSION_FILE"
          echo "match=true" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: python-sdk
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run tests
        working-directory: python-sdk
        run: |
          uv run pytest tests/ -v

      - name: Run linting
        working-directory: python-sdk
        run: |
          ruff check .

      - name: Build package
        working-directory: python-sdk
        run: |
          uv build

      - name: Publish to PyPI
        working-directory: python-sdk
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Note: This step requires PYPI_API_TOKEN secret to be configured
          # For now, this is a placeholder - uncomment when ready to publish
          # uv publish
          echo "Publishing to PyPI (placeholder - configure PYPI_API_TOKEN to enable)"

      - name: Get release date
        id: release_date
        run: |
          RELEASE_DATE=$(date +%Y-%m-%d)
          echo "date=$RELEASE_DATE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: ${{ steps.version.outputs.version_tag }}
          body: |
            ## Installation
            
            ```bash
            pip install agentforge-sdk==${{ steps.version.outputs.version }}
            ```
            
            ## Changes
            
            See the [changelog](https://github.com/thinktwice/agentForge/blob/main/python-sdk/CHANGELOG.md) for details.
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') || contains(inputs.version, 'alpha') || contains(inputs.version, 'beta') || contains(inputs.version, 'rc') }}

