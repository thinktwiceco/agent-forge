[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-sdk"
version = "0.1.0"
description = "Python SDK for Agentforge Agent"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Agentforge Team"},
]
keywords = ["ai", "agent", "llm", "agentforge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/thinktwice/agentForge"
Documentation = "https://github.com/thinktwice/agentForge"
Repository = "https://github.com/thinktwice/agentForge"
Issues = "https://github.com/thinktwice/agentForge/issues"

[project.scripts]
agentforge-test = "agentforge_sdk.cli:test"
agentforge-test-cov = "agentforge_sdk.cli:test_cov"
agentforge-test-fast = "agentforge_sdk.cli:test_fast"
agentforge-lint = "agentforge_sdk.cli:lint"
agentforge-lint-fix = "agentforge_sdk.cli:lint_fix"
agentforge-format = "agentforge_sdk.cli:format_code"
agentforge-format-check = "agentforge_sdk.cli:format_check"
agentforge-check = "agentforge_sdk.cli:check"
agentforge-all = "agentforge_sdk.cli:all_checks"
agentforge = "agentforge_sdk.cli:main"

[tool.hatchling.build]
packages = ["agentforge_sdk"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["agentforge_sdk"]

